name: Deploy site

# One workflow does both jobs:
#   1. refresh games.json from the Pinball Map API
#   2. publish the site to GitHub Pages
#
# They're combined on purpose. If the refresh ran in a separate workflow and
# committed games.json, that commit would be made with GITHUB_TOKEN — and
# commits made with GITHUB_TOKEN do not trigger other workflows. The site
# would silently stop rebuilding. Doing both here sidesteps that entirely.

on:
  push:
    branches: [main]
  schedule:
    # 09:00 UTC daily = 5am ET (4am when EST). Quiet hours either way.
    - cron: "0 9 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # to commit a refreshed games.json
  pages: write # to publish
  id-token: write # required by deploy-pages

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Skips cleanly when the secret hasn't been added yet, so the very first
      # deploy works before you've requested a Pinball Map token.
      - name: Refresh the lineup from Pinball Map
        id: refresh
        continue-on-error: true # a Pinball Map outage must never block a deploy
        env:
          PINBALL_MAP_TOKEN: ${{ secrets.PINBALL_MAP_TOKEN }}
        run: |
          if [ -z "$PINBALL_MAP_TOKEN" ]; then
            echo "::notice::PINBALL_MAP_TOKEN not set — keeping the committed games.json."
            echo "Add it under Settings → Secrets and variables → Actions to enable auto-refresh."
            exit 0
          fi
          node tools/refresh-games.mjs

      - name: Update fallback and validate site
        run: |
          node tools/sync-games.mjs
          node tools/validate-site.mjs

      - name: Commit the lineup if it changed
        run: |
          if git diff --quiet -- games.json index.html; then
            echo "Lineup unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json index.html
          git commit -m "Refresh pinball lineup"
          git push

      - uses: actions/configure-pages@v5

      - name: Collect public site files
        run: |
          mkdir -p _site
          cp index.html games.json instagram.json og-image.jpg CNAME _site/
          cp -R assets _site/assets

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
