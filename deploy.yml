name: Deploy site

# One workflow does both jobs:
#   1. refresh games.json from the Pinball Map API
#   2. publish the site to GitHub Pages
#
# They're combined on purpose. If the refresh ran in a separate workflow and
# committed games.json, that commit would be made with GITHUB_TOKEN — and
# commits made with GITHUB_TOKEN do not trigger other workflows. The site
# would silently stop rebuilding. Doing both here sidesteps that entirely.

on:
  push:
    branches: [main]
  schedule:
    # 09:00 UTC daily = 5am ET (4am when EST). Quiet hours either way.
    - cron: "0 9 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # to commit a refreshed games.json
  pages: write # to publish
  id-token: write # required by deploy-pages

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Skips cleanly when the secret hasn't been added yet, so the very first
      # deploy works before you've requested a Pinball Map token.
      - name: Refresh the lineup from Pinball Map
        id: refresh
        continue-on-error: true # a Pinball Map outage must never block a deploy
        env:
          PINBALL_MAP_TOKEN: ${{ secrets.PINBALL_MAP_TOKEN }}
        run: |
          if [ -z "$PINBALL_MAP_TOKEN" ]; then
            echo "::notice::PINBALL_MAP_TOKEN not set — keeping the committed games.json."
            echo "Add it under Settings → Secrets and variables → Actions to enable auto-refresh."
            exit 0
          fi
          node tools/refresh-games.mjs

      # Downloads the images into assets/ig/ so the site serves its own copies —
      # Instagram's signed CDN URLs expire within days.
      - name: Refresh Instagram posts
        id: ig
        continue-on-error: true # never block a deploy on Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          if [ -z "$INSTAGRAM_TOKEN" ]; then
            echo "::notice::INSTAGRAM_TOKEN not set — the site shows the Follow panel instead."
            exit 0
          fi
          node tools/refresh-instagram.mjs

      # Instagram long-lived tokens last 60 days. The script hands back a fresh
      # one on every run; storing it here means the token never expires as long
      # as this workflow runs. Needs a PAT with "Secrets: write" as GH_PAT —
      # without it the token still works, it just needs manual renewal.
      - name: Store the refreshed Instagram token
        if: steps.ig.outputs.new_token != '' && env.GH_PAT != ''
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set INSTAGRAM_TOKEN --body "${{ steps.ig.outputs.new_token }}"
          echo "::notice::Instagram token refreshed and stored."

      - name: Commit any content that changed
        run: |
          if git diff --quiet -- games.json instagram.json assets/ig; then
            echo "Nothing changed — no commit needed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json instagram.json assets/ig
          git commit -m "Refresh site content"
          git push

      - uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
